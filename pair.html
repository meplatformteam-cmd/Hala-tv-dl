<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hala TV</title>
<style>body{margin:0;background:#0b0b0d;color:#f2f2f5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}h1{font-size:1.4rem;margin:0}
input,button{font:inherit;border-radius:12px;border:1px solid #333;background:#17171b;color:#fff;padding:14px;width:100%;box-sizing:border-box}
button{background:#fff;color:#000;font-weight:700;border:0}.t{display:flex;gap:8px}.t button{background:#17171b;color:#fff;border:1px solid #333}.t button.on{background:#fff;color:#000}
#e{min-height:1.4em;color:#9ad}</style></head><body><main>
<h1>ربط حساب بالتلفزيون</h1>
<div class="t"><button id="tm" class="on">رابط M3U</button><button id="tx">Xtream</button></div>
<input id="n" placeholder="الاسم" maxlength="40">
<div id="m"><input id="u" placeholder="رابط M3U" dir="ltr"></div>
<div id="x" hidden><input id="s" placeholder="السيرفر" dir="ltr"><input id="us" placeholder="اسم المستخدم" dir="ltr"><input id="p" placeholder="كلمة السر" dir="ltr"></div>
<button id="go">إرسال للتلفزيون</button><div id="e"></div></main>
<script>
var P=new URLSearchParams(location.search).get('pair'),xt=false,$=function(i){return document.getElementById(i)};
function mode(v){xt=v;$('m').hidden=v;$('x').hidden=!v;$('tm').className=v?'':'on';$('tx').className=v?'on':''}
$('tm').onclick=function(){mode(false)};$('tx').onclick=function(){mode(true)};
$('go').onclick=function(){if(!P){$('e').textContent='الرابط ناقص. امسح الكود من التلفزيون.';return}
var b={name:$('n').value.trim(),mode:xt?'xt':'m3u',url:$('u').value.trim(),server:$('s').value.trim(),user:$('us').value.trim(),pass:$('p').value.trim()};
fetch('https://ntfy.sh/'+P,{method:'POST',body:JSON.stringify(b)}).then(function(r){$('e').textContent=r.ok?'تم الإرسال ✓':'فشل الإرسال'}).catch(function(){$('e').textContent='فشل الإرسال'})};
</script></body></html>
